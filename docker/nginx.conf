user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 110M;

    # PHP-FPM upstream
    upstream php_fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080;
        server_name _;

        root /app/dist;
        index index.html;

        # PHP files at root level (submit_design.php, create_payment_session.php, etc.)
        location ~ ^/[^/]+\.php$ {
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS "on";
            include fastcgi_params;
        }

        # PHP files in /api/ subdirectory
        location ~ ^/api/.*\.php$ {
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS "on";
            include fastcgi_params;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Images and videos — served from the Railway volume (not baked into the Docker image)
        # Mount the Railway volume at /app/public/images in the Railway dashboard.
        location /images/ {
            alias /app/public/images/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # Diamond JSON data files (no long cache — refreshed by cron)
        location /data/ {
            alias /app/public/data/;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # React SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
