  <style>
    body {
      background-color: #F7F7F7;
      color: #232429;
      font-family: 'Raleway', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Metal', cursive;
      letter-spacing: 0.05em;
    }

    @keyframes bounce-in {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
      60%  { transform: translateX(-50%) scale(1.08); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    .animate-bounce-in {
      animation: bounce-in 0.35s ease-out forwards;
    }

    @keyframes finish-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      60%  { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .animate-finish-pulse {
      animation: finish-pulse 0.9s ease-out 3;
    }

    @keyframes next-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(74, 126, 184, 0.6); }
      60%  { box-shadow: 0 0 0 10px rgba(74, 126, 184, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 126, 184, 0); }
    }
    .animate-next-pulse {
      animation: next-pulse 0.9s ease-out 3;
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }
    @keyframes slideInUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* Button hover: slightly lighter blue */
    button.hover\:bg-brand-dark:hover,
    a.hover\:bg-brand-dark:hover {
      background-color: #6A9FCC !important;
    }
  </style>
  <script>
    tailwind.config = {
